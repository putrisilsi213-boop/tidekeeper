<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidekeeper — Guard the Coral Heart</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04101f; display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #04101f; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Tidekeeper: swim with WASD, aim with the mouse, guard the Coral Heart through 10 waves"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
